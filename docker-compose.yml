version: '3.8'

services:
  neo4j:
    image: neo4j:5
    container_name: ase_knowledge_graph
    ports:
      # SECURITY: Bound exclusively to loopback — never exposed to external network
      - "127.0.0.1:7474:7474" # HTTP Browser (local only)
      - "127.0.0.1:7687:7687" # Bolt/Cypher Protocol (local only)
    environment:
      # Credentials are read from the .env file — NEVER hardcode passwords here.
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}"
    env_file:
      - .env
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
