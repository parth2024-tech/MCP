name: verify
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      ASE_HOME: ${{ github.workspace }}/.cache/ase-home
      ASE_MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/models
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned gitleaks and ast-grep
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C "$HOME/.local/bin" gitleaks
          curl -fsSL "https://github.com/ast-grep/ast-grep/releases/download/0.51.1/app-x86_64-unknown-linux-gnu.zip" -o /tmp/sg.zip
          unzip -q -o /tmp/sg.zip -d "$HOME/.local/bin"
          if [ -f "$HOME/.local/bin/ast-grep" ] && [ ! -f "$HOME/.local/bin/sg" ]; then
            ln -sf "$HOME/.local/bin/ast-grep" "$HOME/.local/bin/sg"
          fi
          chmod +x "$HOME/.local/bin/"*

      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('config/model-pins.json') }}

      - uses: actions/cache@v4
        with:
          path: .cache/eval-skills.db
          key: eval-index-${{ hashFiles('config/model-pins.json', 'skills/**/SKILL.md') }}

      - run: npm ci

      - name: Run deterministic verification gate
        env:
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD~1..HEAD' }}
        run: just verify

      - name: Run Tier R routing evaluation gate
        run: just eval-routing
